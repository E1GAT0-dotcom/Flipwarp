# The tests. The build itself is proved by the deploy workflow every time the
# site goes out, so repeating it here would only mean waiting for the same
# work twice on every push — this runs the part that workflow does not.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
