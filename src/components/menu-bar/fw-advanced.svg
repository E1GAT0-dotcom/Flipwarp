<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Flipwarp's F, in the same white as the rest of the menu bar's icons.
     The logo's own green cannot be used here: the bar is already that green,
     and a green mark on a green bar is not a mark. The shape is what carries
     it, so the shape is what is kept — a slab-serif F.

     The two arms start at the stem and reach right, never left: an arm that
     overhangs on both sides turns the letter into a T at this size. Only the
     foot overhangs, evenly, which is what reads as a serif rather than a
     third arm — the difference between an F and an E.

     Rendered through an <img>, so it cannot inherit a colour from the page
     and states its own. -->
<svg
   aria-hidden="true"
   viewBox="0 0 24 24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g fill="#ffffff">
    <!-- The stem, from cap height down to the baseline. -->
    <rect x="8.6" y="3.6" width="4.2" height="16.8" rx="0.5" />
    <!-- The top arm, reaching right from the stem. -->
    <rect x="8.6" y="3.6" width="11" height="3.1" rx="0.5" />
    <!-- The middle arm, shorter, as an F's is. -->
    <rect x="8.6" y="10.1" width="8" height="2.9" rx="0.5" />
    <!-- The foot, overhanging evenly on both sides. -->
    <rect x="6.1" y="17.3" width="9.2" height="3.1" rx="0.5" />
  </g>
</svg>
