<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipwarp Saver</title>
  <style>
    /* --- FlipWarp's theme colours (light; dark below) --- */
    :root {
      --accent: #00b300;
      --page: hsla(215, 100%, 95%, 1);
      --modal: #ffffff;
      --modal-header: var(--accent);
      --text: hsla(225, 15%, 40%, 1);
      --border: hsla(0, 0%, 0%, 0.15);
      --warn: #ff8c1a;
    }

    :root[data-theme="dark"] {
      --page: #111111;
      --modal: #111111;
      --modal-header: #333333;
      --text: #eeeeee;
      --border: #ffffff26;
    }

    /* --- page --- */
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.875rem;
    }

    /* the green bar along the top, like FlipWarp's menu bar */
    .menu-bar {
      height: 3rem;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      background: var(--accent);
      color: #ffffff;
      font-weight: bold;
      font-size: 1rem;
    }

    /* --- the window, like FlipWarp's own windows --- */
    .modal {
      width: min(600px, calc(100% - 2rem));
      margin: 50px auto;
      border: 4px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      background: var(--modal);
    }

    .modal-header {
      margin: 0;
      height: 3.125rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--modal-header);
      color: #ffffff;
      font-weight: bold;
      font-size: 1rem;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.5rem 2.25rem;
    }

    .modal-body p {
      margin: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* FlipWarp's button */
    .button {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* --- what happened --- */
    .result[hidden] {
      display: none;
    }

    .result {
      padding: 0.5rem;
      border: 2px solid var(--border);
      border-radius: 0.5rem;
    }

    .result.bad {
      border-color: var(--warn);
    }

    .result a {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header class="menu-bar">Flipwarp</header>

  <main class="modal">
    <h1 class="modal-header">Save Project</h1>
    <div class="modal-body">
      <p>Paste a project copied with File &gt; Save to your computer in FlipWarp.</p>
      <div class="actions">
        <span>or press Ctrl+V</span>
        <button type="button" class="button" id="paste">Paste</button>
      </div>
      <div class="result" id="result" role="status" hidden></div>
    </div>
  </main>

  <script>
    // Same theme as FlipWarp on this site (its "tw:theme" setting).
    (function () {
      var accents = {purple: '#855cd6', blue: '#4c97ff', red: '#ff4c4c', green: '#00b300'};
      var gui = '';
      try {
        var setting = localStorage.getItem('tw:theme');
        if (setting === 'light' || setting === 'dark') gui = setting;
        else if (setting) {
          var parsed = JSON.parse(setting);
          if (accents[parsed.accent]) document.documentElement.style.setProperty('--accent', accents[parsed.accent]);
          if (parsed.gui === 'light' || parsed.gui === 'dark') gui = parsed.gui;
        }
      } catch (e) {
        // no setting yet
      }
      if (!gui) gui = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', gui);
    }());

    // The copied text: "FLIPWARP-SB3 name.sb3" on the first line, then the
    // project in base64. It is turned back into the file here, in the browser.
    const result = document.getElementById('result');
    let lastUrl = null;

    const show = (ok, html) => {
      result.hidden = false;
      result.className = ok ? 'result' : 'result bad';
      result.innerHTML = html;
    };

    const escapeHtml = text => text.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

    const fromBase64 = base64 => {
      if (Uint8Array.fromBase64) return Uint8Array.fromBase64(base64);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    };

    const save = text => {
      text = (text || '').trim();
      let name = 'Project.sb3';
      let base64 = text;
      const header = text.match(/^FLIPWARP-SB3 ([^\r\n]*)\r?\n/);
      if (header) {
        name = header[1].trim() || name;
        base64 = text.slice(header[0].length);
      } else if (text.startsWith('data:')) {
        base64 = text.slice(text.indexOf(',') + 1);
      }
      base64 = base64.replace(/\s+/g, '');
      if (!/\.sb3$/i.test(name)) name += '.sb3';

      let bytes;
      try {
        bytes = fromBase64(base64);
      } catch (e) {
        bytes = null;
      }
      // Every .sb3 is a zip file, and zip files start with "PK".
      if (!text || !bytes || bytes.length < 4 || bytes[0] !== 0x50 || bytes[1] !== 0x4b) {
        show(false, 'That isn\'t a copied FlipWarp project.');
        return;
      }

      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([bytes], {type: 'application/x.scratch.sb3'}));
      const link = document.createElement('a');
      link.href = lastUrl;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();

      show(true, `Downloaded ${escapeHtml(name)}. ` +
        `<a href="${lastUrl}" download="${escapeHtml(name)}">Download again</a>`);
    };

    // The Paste button reads the clipboard (the browser may ask first).
    document.getElementById('paste').addEventListener('click', async () => {
      try {
        save(await navigator.clipboard.readText());
      } catch (e) {
        show(false, 'The browser blocked the clipboard. Press Ctrl+V instead.');
      }
    });

    // Ctrl+V anywhere on the page.
    document.addEventListener('paste', event => {
      event.preventDefault();
      save(event.clipboardData.getData('text'));
    });
  </script>
</body>
</html>
